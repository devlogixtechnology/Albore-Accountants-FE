name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js with cache
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Step 3: Clean install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run Linter & TypeScript Check
      - name: Run Linter & Type Check
        run: |
          npm run lint
          npx tsc --noEmit

      # Step 5: Build application
      - name: Build application
        run: npm run build