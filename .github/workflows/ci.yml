name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Automatically caches global npm dependencies

      # Step 3: Clean install dependencies (fails if package-lock is out of sync)
      - name: Install dependencies
        run: npm ci

      # Step 4: Run Code Linting & TypeScript Type Checks
      - name: Run Linter & Type Check
        run: |
          npm run lint
          npx tsc --noEmit

      # Step 5: Build the application
      - name: Build application
        run: npm run build
